name: Build Windows release

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      CGO_ENABLED: '0'
      GOOS: windows
      GOARCH: amd64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: stable
          check-latest: true
          cache: false
      - name: Check source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          go vet ./...
          if ($LASTEXITCODE -ne 0) { throw 'Go vet failed' }
          $unformatted = gofmt -l .
          if ($unformatted) { throw "Unformatted source: $unformatted" }
      - name: Build and package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path package, output | Out-Null
          go build -trimpath -ldflags '-H=windowsgui -s -w' -o package/sblink.exe .
          if ($LASTEXITCODE -ne 0) { throw 'Go build failed' }
          Copy-Item README.md package/README.md
          Copy-Item LICENSE package/LICENSE.txt
          $checksums = 'sblink.exe', 'README.md', 'LICENSE.txt' | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath "package/$_").Hash.ToLowerInvariant()
            "$hash  $_"
          }
          $checksums | Set-Content -Encoding utf8 package/SHA256SUMS.txt
          Compress-Archive -Path package/* -DestinationPath output/sblink-windows-x64.zip
          $zipHash = (Get-FileHash -Algorithm SHA256 output/sblink-windows-x64.zip).Hash.ToLowerInvariant()
          "$zipHash  sblink-windows-x64.zip" | Set-Content -Encoding utf8 output/sblink-windows-x64.zip.sha256
      - name: Save downloadable build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: sblink-windows-x64
          path: output/*
          if-no-files-found: error
          retention-days: 90
      - name: Attach files to published release
        if: github.event_name == 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$env:RELEASE_TAG" output/sblink-windows-x64.zip output/sblink-windows-x64.zip.sha256 --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed' }
